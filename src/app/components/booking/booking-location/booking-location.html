<main class="grid grid-center">
  <div class="order-location-container glass">
    <h2 class="text-justify-center">Fazer Uma Reserva</h2>
    <h3 class="text-justify-center">(Make A Reservation)</h3>

    <div class="branches grid grid-2">
      @for (branch of branches(); track branch.identifier) {
        <a class="branch glass flex flex-align-center cursor-pointer" href="{{ branch.redirects.reservation }}" target="_blank">
            <i class="material-icons">location_on</i>
            <span>{{ branch.name }}</span>
        </a>
      }
    </div>
  </div>

</main>
