<main class="grid grid-center">
    <div class="container glass">

        @for (branch of branches(); track branch.identifier) {
            <div class="glass">
                <div class="data">
                    <div>
                        <h2>{{branch.name}}</h2>
                    </div>
                    <div class="glass">
                        <p><i class="material-icons">location_on</i> {{branch.address}}</p>
                        <P><i class="material-icons">phone</i> {{branch.phone}}</P>
                    </div>
                @if (branch.openingTime) {
                    <div class="glass">
                        <h3>Opening Time:</h3>
                        @for (time of branch.openingTime; track time.day) {
                            <p>{{time.day}}: {{time.time}}</p>
                        }
                    </div>
                }
            </div>
            <br>
            <div id="map-{{branch.identifier}}" class="map"></div>
        </div>
    }
</div>

</main>
