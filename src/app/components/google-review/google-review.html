<main class="grid grid-center">
  <div class="order-location-container glass">
    <h2>Avaliaqöes no Google</h2>
    <h3>Review on Google</h3>

    <div class="branches grid grid-2">
      @for (branch of branches(); track branch.identifier) {
        <a class="branch glass" href="{{ branch.redirects.googleReview }}" target="_blank">
            <i class="material-symbols-outlined">location_on</i>
            <span>{{ branch.name }}</span>
        </a>
      }
    </div>
  </div>

</main>
